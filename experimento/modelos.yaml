# Modelos do experimento (decisão D10): ChatGPT, Claude, Gemini e DeepSeek.
#
# Acesso (L5b, 01/10/2026): todos pelo OpenRouter, com uma chave só. Cada modelo
# fixa o endpoint do seu provedor de origem (`provedor`), sem fallback para outro
# e exigindo que ele aceite todos os parâmetros enviados (ver provedores.py).
#
# Modelos escolhidos pelo autor em 02/10/2026: Gemini 3.1 Pro Preview, Claude
# Opus 5.5 e DeepSeek V4 Pro (0813), no lugar do Gemini 3.8 Flash, do Claude
# Sonnet 5.5 e do DeepSeek V4.1 Flash; o GPT-5.6 Sol fica. Todos no endpoint do
# provedor de origem, conferidos no catálogo público do OpenRouter em 02/10/2026.
#
# Depois de mudar qualquer coisa, rode `harness.py modelos`: ele confere cada
# modelo no catálogo (snapshot, endpoint, parâmetros aceitos, preço) e aponta o
# que não bate. Não precisa de chave e não faz chamada de inferência.
#
# Parâmetros (D13): temperatura 0 onde o endpoint fixado aceita, com uma exceção.
# O Claude Opus 5.5 e o GPT-5.6 não aceitam temperatura (o endpoint não a lista);
# com `require_parameters`, mandá-la faria a chamada falhar, então ela fica de
# fora nesses dois. O Gemini aceita, mas fica com a padrão (1), por decisão do
# autor em 02/10/2026: o Google recomenda mantê-la em todos os Gemini 3, porque
# abaixo de 1 o modelo pode entrar em laço ou ter desempenho pior
# (ai.google.dev/gemini-api/docs/gemini-3, consultado em 02/10/2026). Só a
# DeepSeek vai com 0. A diferença entre os braços vai para a metodologia. Fora
# isso, vale o padrão de cada modelo (raciocínio inclusive).
#
# Formato: `json_schema` (saída estruturada, esquema validado) onde o endpoint
# aceita; o da DeepSeek só aceita `json_object` (JSON válido, sem esquema). O
# formato está no prompt para todos.
#
# Preços em US$ por milhão de tokens no endpoint fixado, copiados do catálogo
# (o `modelos` confere); onde o preço varia com a hora, o maior. São para o
# `estimar`; a cobrança real vem em cada resposta (`custo`).

# Limite de tokens de saída, raciocínio incluído (decisão do autor, 02/10/2026):
# 64.000, perto do máximo do endpoint mais restrito (Gemini, 65.536), para que
# nenhuma resposta seja cortada pelo limite. No teste com 16.000, a DeepSeek
# gastou 14.924 em raciocínio no modo forçado e a resposta saiu cortada. Só se
# paga o que o modelo gera. Mudar o limite torna desatualizadas as respostas
# gravadas com o anterior.
max_tokens: 64000
execucoes: 1            # D13: uma execução por entrada, modelo e modo, como no artigo de ferramentas

acesso:
  api: https://openrouter.ai/api/v1
  env: OPENROUTER_API_KEY
  # Política de dados (decisão do autor, 02/10/2026): "deny" só deixa ir a
  # provedores que, pela política registrada no OpenRouter, não treinam com os
  # prompts (guardá-los por um tempo é outra coisa, que só o ZDR exclui). Vale
  # para todos menos a DeepSeek, que tem "allow" no próprio bloco: o endpoint
  # oficial dela guarda os prompts e treina com eles, e "deny" o excluiria. Os
  # endpoints da OpenAI, da Anthropic (30 dias) e do Google AI Studio (55 dias)
  # guardam e não treinam. A configuração de privacidade da conta do OpenRouter
  # tem de permitir endpoints pagos que treinam, senão a DeepSeek falha.
  data_collection: deny

modelos:
  - nome: ChatGPT
    id: openai/gpt-5.6-sol
    canonico: openai/gpt-5.6-sol-20260709
    provedor: openai
    formato: json_schema
    params: {}
    preco_entrada: 2.0
    preco_saida: 10.0

  - nome: Claude
    id: anthropic/claude-opus-5.5
    canonico: anthropic/claude-opus-5.5-20260921
    provedor: anthropic
    formato: json_schema
    params: {}
    preco_entrada: 4.0
    preco_saida: 20.0

  - nome: Gemini
    id: google/gemini-3.1-pro-preview
    canonico: google/gemini-3.1-pro-preview-20260219
    provedor: google-ai-studio
    formato: json_schema
    params: {}                       # temperatura padrão (1), como o Google recomenda nos Gemini 3
    preco_entrada: 2.0
    preco_saida: 12.0

  - nome: DeepSeek
    id: deepseek/deepseek-v4-pro-0813
    canonico: deepseek/deepseek-v4-pro-20260813
    provedor: deepseek
    formato: json_object
    params: {temperature: 0}
    data_collection: allow           # o endpoint oficial treina com os prompts (decisão do autor, 02/10/2026)
    preco_entrada: 1.32
    preco_saida: 3.96
